services:
  db:
    image: postgres:17
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      # Local dev database: no password, reachable from localhost only
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1']
      interval: 1s
      retries: 30

volumes:
  pgdata:
